[tool.black]
line-length = 88
target-version = ["py310"]
skip-string-normalization = false
exclude = '''
            /(
                \.git
            | \.venv
            | \.ipynb_checkpoints
            | dev\.ipynb
            )/
        '''

[tool.ruff]
target-version = "py310"
line-length = 88
fix = false
lint.select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "B",    # bugbear (common bugs)
    "UP",   # pyupgrade
]
lint.ignore = [
    "E501",  # line length (Black handles this)
    "UP038"
]

lint.exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    "logs",
    "data",
    "*.ipynb"
]
